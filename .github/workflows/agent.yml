name: Arc Calls Agent

on:
  schedule:
    - cron: '0 8 * * *'  # 8AM UTC daily
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'agent/package.json'
      - run: npm install
        working-directory: ./agent
      - run: node agent.js
        working-directory: ./agent
        env:
          AGENT_WALLET_KEY: ${{ secrets.AGENT_WALLET_KEY || secrets.AGENT_PRIVATE_KEY }}
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_WALLET_KEY || secrets.AGENT_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BETTING_POOL_ADDRESS: ${{ secrets.BETTING_POOL_ADDRESS }}
