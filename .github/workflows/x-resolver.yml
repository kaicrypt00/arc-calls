name: Arc Calls — X Resolver

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 min — arc-calls is public repo (unlimited Actions minutes)
  workflow_dispatch:       # Manual run button in GitHub Actions UI

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15    # 2 attempts × 5min gap + processing headroom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'agents/package.json'

      - name: Install dependencies
        run: npm install
        working-directory: agents

      - name: Run X Resolver
        run: node x-resolver.js
        working-directory: agents
        env:
          RESOLVER_ADMIN_KEY:        ${{ secrets.RESOLVER_ADMIN_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BETTING_POOL_ADDRESS:      ${{ secrets.BETTING_POOL_ADDRESS }}
