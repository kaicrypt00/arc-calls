name: Arc Agent 001 - Profile Setup (run once)

on:
  # Manual trigger only — run once from GitHub Actions tab
  workflow_dispatch:

jobs:
  setup-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'agent/package.json'

      - name: Install agent dependencies
        run: npm install
        working-directory: agent

      - name: Run Arc Agent 001 Profile Setup
        run: node setup.js
        working-directory: agent
        env:
          AGENT_WALLET_KEY:          ${{ secrets.AGENT_WALLET_KEY || secrets.AGENT_PRIVATE_KEY }}
          AGENT_PRIVATE_KEY:         ${{ secrets.AGENT_WALLET_KEY || secrets.AGENT_PRIVATE_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BETTING_POOL_ADDRESS:      ${{ secrets.BETTING_POOL_ADDRESS }}
          PROFILE_REGISTRY_ADDRESS:  ${{ secrets.PROFILE_REGISTRY_ADDRESS }}

